; update_hosts.ini
; 1. Wait for the login prompt and send 'root'
expect "login: " send "root\r"

; 2. Wait for the root shell prompt (#)
; We sleep for 2 seconds to let the motd and shell load fully
expect "# " sleep 2; send "echo '172.20.0.15 target-node' >> /etc/hosts\r"

; 3. Verification - this will print the change to the console log
expect "# " send "tail -n 1 /etc/hosts\r"

; 4. Final confirmation message
expect "# " send "echo 'HOST_UPDATE_COMPLETE'\r"

; Return control to the Simh console
continue