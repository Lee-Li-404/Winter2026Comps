<!doctype html>
<html>
  <head>
    <title>Morris Worm Live Tracker</title>
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <style type="text/css">
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: "Courier New", Courier, monospace;
        margin: 0;
      }
      #network {
        width: 100vw;
        height: 100vh;
        border: none;
      }
      .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border: 1px solid #30363d;
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 18px;
        color: #58a6ff;
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
        font-size: 14px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 10px;
      }
      .clean {
        background-color: #2ea043;
        border: 2px solid #2ea043;
      }
      .infected {
        background-color: #da3633;
        border: 2px solid #da3633;
        box-shadow: 0 0 10px #da3633;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>CLUSTER STATUS</h1>
      <div class="legend-item">
        <div class="dot clean"></div>
        System Normal
      </div>
      <div class="legend-item">
        <div class="dot infected"></div>
        Infected
      </div>
      <div id="status-text" style="margin-top: 10px; color: #8b949e">
        Scanning...
      </div>
    </div>

    <div id="network"></div>

    <script type="text/javascript">
      // --- Configuration ---
      // Mapping IPs to Vis.js Node IDs
      const ipMap = {
        "172.20.0.10": 10,
        "172.20.0.11": 11,
        "172.20.0.12": 12,
        "172.20.0.13": 13,
        "172.20.0.14": 14,
        "172.20.0.15": 15,
        "172.20.0.16": 16,
        "172.20.0.17": 17,
        "172.20.0.18": 18,
        "172.20.0.19": 19,
      };

      // --- Network Topology ---
      var nodes = new vis.DataSet([
        { id: 2, label: "Router\n(Gateway 1)", shape: "box", color: "#8b949e" },
        { id: 3, label: "Router\n(Gateway 2)", shape: "box", color: "#8b949e" },

        // Subnet 1 Nodes
        { id: 10, label: "TARGET PRIME\n172.20.0.10", group: "vax" },
        { id: 11, label: "Node 1\n172.20.0.11", group: "vax" },
        { id: 12, label: "Node 2\n172.20.0.12", group: "vax" },
        { id: 13, label: "Node 3\n172.20.0.13", group: "vax" },
        { id: 14, label: "Node 4\n172.20.0.14", group: "vax" },

        // Subnet 2 Nodes
        { id: 15, label: "Node 5\n172.20.0.15", group: "vax" },
        { id: 16, label: "Node 6\n172.20.0.16", group: "vax" },
        { id: 17, label: "Node 7\n172.20.0.17", group: "vax" },
        { id: 18, label: "Node 8\n172.20.0.18", group: "vax" },
        { id: 19, label: "Node 9\n172.20.0.19", group: "vax" },
      ]);

      var edges = new vis.DataSet([
        // Gateway 1 Connections
        { from: 2, to: 10 },
        { from: 2, to: 11 },
        { from: 2, to: 12 },
        { from: 2, to: 13 },
        { from: 2, to: 14 },

        // Gateway 2 Connections
        { from: 3, to: 15 },
        { from: 3, to: 16 },
        { from: 3, to: 17 },
        { from: 3, to: 18 },
        { from: 3, to: 19 },

        // The Bridge between Node 4 and Node 5
        {
          from: 14,
          to: 15,
          width: 2,
          dashes: true,
          color: { color: "#58a6ff" },
        },
      ]);

      // Render the Graph
      var container = document.getElementById("network");
      var data = { nodes: nodes, edges: edges };
      var options = {
        nodes: {
          shape: "dot",
          size: 20,
          font: { face: "Courier New", color: "#c9d1d9" },
          borderWidth: 2,
        },
        groups: {
          vax: { color: { background: "#0d1117", border: "#2ea043" } }, // Default Clean Green
        },
        physics: { stabilization: false },
        interaction: { hover: true },
      };
      var network = new vis.Network(container, data, options);

      // --- Live Updater ---
      async function checkInfections() {
        try {
          // Read the file generated by tracker.sh
          const response = await fetch("infected.txt?t=" + Date.now());
          if (!response.ok) throw new Error("No data yet");

          const text = await response.text();
          const lines = text.split("\n");
          let count = 0;

          lines.forEach((ip) => {
            ip = ip.trim();
            if (ipMap[ip]) {
              // Turn node RED if infected
              nodes.update({
                id: ipMap[ip],
                color: { background: "#da3633", border: "#da3633" },
                shadow: { enabled: true, color: "#da3633", size: 20 },
              });
              count++;
            }
          });

          if (count > 0) {
            document.getElementById("status-text").innerText =
              `ALERT: ${count} Systems Compromised`;
            document.getElementById("status-text").style.color = "#da3633";
          }
        } catch (e) {
          console.log("Waiting for tracker data...");
        }
      }

      // Poll every 1 second
      setInterval(checkInfections, 1000);
    </script>
  </body>
</html>
