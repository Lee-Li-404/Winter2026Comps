version: "3.8"

x-bsd-defaults: &bsd-defaults
  build: .
  image: ye-olde-bsd
  stdin_open: true
  tty: true
  privileged: true
  deploy:
    resources:
      limits:
        cpus: "0.1"
  command: >
    /bin/sh -c "./identity.exp && exec ./vax780 boot.ini"

services:
  # --- VAX NODES (10 Nodes Total) ---

  attacker:
    <<: *bsd-defaults
    container_name: attacker
    environment:
      - HOSTNAME=attacker
      - DOCKER_IP=172.20.0.10
      - NEIGHBOR_IP=172.20.0.11
      - NEIGHBOR_NAME=node-1
    networks:
      net_alpha:
        ipv4_address: 172.20.0.10
    ports:
      - "2300:23"
      - "2500:25"
      - "7900:79"

  node-1:
    <<: *bsd-defaults
    container_name: node-1
    environment:
      - HOSTNAME=node-1
      - DOCKER_IP=172.20.0.11
      - NEIGHBOR_IP=172.20.0.12
      - NEIGHBOR_NAME=node-2
    networks:
      net_alpha:
        ipv4_address: 172.20.0.11
    ports:
      - "2301:23"
      - "2501:25"

  node-2:
    <<: *bsd-defaults
    container_name: node-2
    environment:
      - HOSTNAME=node-2
      - DOCKER_IP=172.20.0.12
      - NEIGHBOR_IP=172.20.0.13
      - NEIGHBOR_NAME=node-3
    networks:
      net_alpha:
        ipv4_address: 172.20.0.12
    ports:
      - "2302:23"
      - "2502:25"

  node-3:
    <<: *bsd-defaults
    container_name: node-3
    environment:
      - HOSTNAME=node-3
      - DOCKER_IP=172.20.0.13
      - NEIGHBOR_IP=172.20.0.14
      - NEIGHBOR_NAME=node-4
    networks:
      net_alpha:
        ipv4_address: 172.20.0.13
    ports:
      - "2303:23"
      - "2503:25"

  node-4:
    <<: *bsd-defaults
    container_name: node-4
    environment:
      - HOSTNAME=node-4
      - DOCKER_IP=172.20.0.14
      - NEIGHBOR_IP=172.20.0.15
      - NEIGHBOR_NAME=node-5
    networks:
      net_alpha:
        ipv4_address: 172.20.0.14
    ports:
      - "2304:23"
      - "2504:25"

  node-5:
    <<: *bsd-defaults
    container_name: node-5
    environment:
      - HOSTNAME=node-5
      - DOCKER_IP=172.20.0.15
      - NEIGHBOR_IP=172.20.0.16
      - NEIGHBOR_NAME=node-6
    networks:
      net_alpha:
        ipv4_address: 172.20.0.15
    ports:
      - "2305:23"
      - "2505:25"

  node-6:
    <<: *bsd-defaults
    container_name: node-6
    environment:
      - HOSTNAME=node-6
      - DOCKER_IP=172.20.0.16
      - NEIGHBOR_IP=172.20.0.17
      - NEIGHBOR_NAME=node-7
    networks:
      net_alpha:
        ipv4_address: 172.20.0.16
    ports:
      - "2306:23"
      - "2506:25"

  node-7:
    <<: *bsd-defaults
    container_name: node-7
    environment:
      - HOSTNAME=node-7
      - DOCKER_IP=172.20.0.17
      - NEIGHBOR_IP=172.20.0.18
      - NEIGHBOR_NAME=node-8
    networks:
      net_alpha:
        ipv4_address: 172.20.0.17
    ports:
      - "2307:23"
      - "2507:25"

  node-8:
    <<: *bsd-defaults
    container_name: node-8
    environment:
      - HOSTNAME=node-8
      - DOCKER_IP=172.20.0.18
      - NEIGHBOR_IP=172.20.0.19
      - NEIGHBOR_NAME=node-9
    networks:
      net_alpha:
        ipv4_address: 172.20.0.18
    ports:
      - "2308:23"
      - "2508:25"

  node-9:
    <<: *bsd-defaults
    container_name: node-9
    environment:
      - HOSTNAME=node-9
      - DOCKER_IP=172.20.0.19
      - NEIGHBOR_IP=172.20.0.19
      - NEIGHBOR_NAME=attacker
    networks:
      net_alpha:
        ipv4_address: 172.20.0.19
    ports:
      - "2309:23"
      - "2509:25"

  # --- SUPPORT ---

  internet-sim:
    image: alpine:latest
    container_name: internet-sim
    privileged: true
    networks:
      net_alpha:
        ipv4_address: 172.20.0.100
    command: >
      /bin/sh -c "
      sleep 2 &&
      ip addr add 1.2.3.4/32 dev eth0 || true &&
      echo 'Internet Sim Ready' &&
      tail -f /dev/null
      "

  tracker:
    image: alpine:latest
    container_name: tracker
    privileged: true
    network_mode: "host"
    volumes:
      - ./tracker.sh:/app/tracker.sh
      - ../visualization:/app/visualization
    working_dir: /app
    command: >
      /bin/sh -c "
      apk add --no-cache tcpdump grep sed &&
      chmod +x tracker.sh &&
      ./tracker.sh
      "

networks:
  net_alpha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
